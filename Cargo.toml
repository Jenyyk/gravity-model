[package]
name = "gravity-model"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "0.3.77"
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.140"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"

[lib]
crate-type = ["cdylib"]
